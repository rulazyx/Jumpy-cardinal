<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#e5484d">
  <title>Jumpy Cardinal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="g-flappy"></main>
  <script type="module">
    // Version autonome du jeu : sans compte ni serveur, le meilleur score est gardé sur l'appareil.
    import { mount } from './games/flappy.js';
    import { logoArt } from './gameart.js';
    const root = document.getElementById('game');
    const best = () => Number(localStorage.getItem('jc-best') || 0);
    const handle = mount(root, {
      bird: localStorage.getItem('jc-bird'),
      onEnd: ({ score }) => { if (score > best()) localStorage.setItem('jc-best', score); },
    });
    // Écran de chargement (comme dans La Kaz) : le jeu reste en pause dessous, puis l'écran s'efface
    const splash = document.createElement('div');
    splash.className = 'gsplash';
    splash.innerHTML = `<div class="gs-art">${logoArt('flappy')}</div><div class="gs-name">Jumpy Cardinal</div><div class="gs-bar"><i></i></div>`;
    root.appendChild(splash);
    handle.pause();
    setTimeout(() => { splash.remove(); handle.resume(); }, 1150);
    // « Menu principal » : pas encore de menu dans cette version, on relance une partie
    root.addEventListener('click', (e) => { if (e.target.closest('[data-gact="home"]')) location.reload(); });
  </script>
</body>
</html>
