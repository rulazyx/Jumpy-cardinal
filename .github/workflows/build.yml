name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]  # Se lance automatiquement quand vous poussez du code (ajustez "main" ou "master" selon votre branche par défaut)
  workflow_dispatch: # Permet aussi de lancer le build manuellement depuis le site de GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Vous pouvez adapter selon votre version de Node

      - name: Install dependencies
        run: npm install

      - name: Build web assets (si vous utilisez un framework type React/Vue/Ionic, adaptez la commande de build si besoin)
        run: npm run build --if-present

      - name: Add Android platform with Capacitor
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 17 (pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
