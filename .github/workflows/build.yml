name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare web folder and Capacitor
        run: |
          # Crée un dossier "www" pour les fichiers web
          mkdir www
          
          # Déplace tous les fichiers du jeu dedans (sauf les dossiers cachés et config git/github)
          shopt -s extglob
          cp -r !(www|.github|android|node_modules) www/ 2>/dev/null || true
          
          # Crée le package.json et installe Capacitor
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          
          # Initialise Capacitor avec "www" comme web-dir valide
          npx cap init "Jumpy Cardinal" "com.rulazyx.jumpycardinal" --web-dir "www"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools-34.0.0 platforms-android-34'
          accept-android-sdk-licenses: true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
